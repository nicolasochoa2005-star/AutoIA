services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: autotube
      POSTGRES_PASSWORD: autotube
      POSTGRES_DB: autotube
    ports:
      - "5432:5432"
    volumes:
      - autotube_pgdata:/var/lib/postgresql/data

volumes:
  autotube_pgdata:
